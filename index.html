        window.finalizeDay = function() {
            // DEBUG OVERRIDE
            if (state.debugMode) {
                // Ensure overlays are gone
                document.getElementById('modal-overlay').classList.add('hidden');
                window.renderMinigameList();
                return;
            }
            let expenses = []; 
            let totalCost = 0;
            
            // 1. Generate Random Daily Expenses (Mundane stuff)
            let pool = [...window.EXPENSES_POOL].sort(() => 0.5 - Math.random());
            let count = Math.floor(Math.random() * 3) + 2; 
            
            for(let i=0; i<count; i++) { 
                expenses.push({ ...pool[i], type: 'cash' }); 
                totalCost += pool[i].cost; 
            }

            // 2. Subscription Billing (Moved from startNextDay)
            if (state.dayTotal % 7 === 0) {
                let billTotal = 0;
                state.subscriptions.forEach(subId => {
                    const subItem = window.STORE_ITEMS.find(i => i.id === subId);
                    if (subItem) billTotal += subItem.cost;
                });

                if (billTotal > 0) {
                    totalCost += billTotal;
                    // Force to top
                    expenses.unshift({ name: "Weekly Subscriptions", cost: billTotal, type: 'cash' });
                }
            }
            
            // 3. Pet Fish Logic (Moved from startNextDay)
            if (state.purchasedItems.includes('fish')) {
                if (!state.fish) state.fish = [{ icon: '🐠', name: 'Sir Bubbles', life: 99 }];

                // Water degrades
                const degradation = Math.ceil(state.fish.length / 2);
                state.fishWaterDays -= degradation;
                
                let fishStress = 0;
                
                // Lifespan Check
                let deadFish = [];
                state.fish.forEach((f) => {
                    f.life--;
                    if (f.life <= 0) deadFish.push(f.name);
                });
                
                if (deadFish.length > 0) {
                    state.fish = state.fish.filter(f => f.life > 0);
                    // Queue this to appear over the summary
                    window.queueModal("RIP", `${deadFish.join(', ')} passed away peacefully.`, "Goodbye", "⚰️");
                    fishStress += 5 * deadFish.length;
                }
                
                // Status Effects
                const anyHungry = state.fish.some(f => (f.hunger || 0) < 2);
                if (!state.fishFed && anyHungry) {
                    fishStress += 5;
                    expenses.unshift({ name: "Hungry Fish Guilt", cost: 5, type: 'stress' });
                }
                
                if (state.fishWaterDays <= 0) {
                    fishStress += 10;
                    expenses.unshift({ name: "Dirty Tank Guilt", cost: 10, type: 'stress' });
                }
                
                // Reward (Zen)
                if (state.fishFed && state.fishWaterDays > 0) {
                    const relief = state.fish.length * 5;
                    state.stress = Math.max(0, state.stress - relief);
                    // Negative cost = Green Relief text
                    expenses.unshift({ name: "Fish Tank Zen", cost: -relief, type: 'stress' });
                }
                
                state.stress = Math.min(100, state.stress + fishStress);
                state.fishFed = false; // Reset for tomorrow
            }

            // 4. Shoe Logic (Moved from startNextDay)
            if (state.purchasedItems.includes('shoes')) {
                 state.shoeDaysLeft--;
                 // Passive reduction (10%)
                 state.stress = Math.max(0, state.stress - 10);
                 expenses.unshift({ name: "Comfy Shoes", cost: -10, type: 'stress' });

                 if (state.shoeDaysLeft <= 0) {
                    state.purchasedItems = state.purchasedItems.filter(i => i !== 'shoes');
                    window.queueModal("WORN OUT", "Your Designer Shoes have fallen apart.", "Darn", "👟");
                }
            }

            // 5. First Aid Skill (Moved from startNextDay)
            if (state.skill === 'aid') {
                state.stress = Math.max(0, state.stress - 20);
                expenses.unshift({ name: "Deep Sleep Skill", cost: -20, type: 'stress' });
            }

            // 6. Triton Plushie Logic (Balanced)
            if (state.purchasedItems.includes('plush') && state.stress >= 80) {
                 // 1. Relief
                 state.stress = Math.max(0, state.stress - 10);
                 expenses.unshift({ name: "Plushie Comfort", cost: -10, type: 'stress' });
                 
                 // 2. Social Penalty
                 state.social = Math.max(0, state.social - 10);
                 expenses.push({ name: "Social Stigma", cost: 10, type: 'stress' }); // Display as +10 stress visually or we can add a 'social' type later, but red text works for bad stuff. Let's force red text manually or reuse 'stress'.
                 // Actually, let's just log it:
                 state.log.unshift("Relied on plushie. Social standing took a hit.");

                 // 3. Durability
                 state.plushUsesLeft--;
                 if (state.plushUsesLeft <= 0) {
                    state.purchasedItems = state.purchasedItems.filter(i => i !== 'plush');
                    window.queueModal("RIP PLUSHIE", "You squeezed the Triton Plushie too hard. It burst.", "Darn", "🧸");
                 }
            }
            // 7. Sleep Quality Forecast (Energy Recovery)
            if (state.negativeTrait === 'sleepy') {
                expenses.push({ name: "Sleepyhead Trait", cost: 20, type: 'energy' });
            }
            if (state.stress > 60) {
                expenses.push({ name: "High Stress Insomnia", cost: 20, type: 'energy' });
            }
            if (state.hungerLevel === 0) {
                expenses.push({ name: "Hunger Pangs", cost: 20, type: 'energy' });
            }

            // Apply Financials
            state.balance -= totalCost;
        state.endgameStats.totalMoneySpent += totalCost; 
            state.dayStats.cash -= totalCost; 
            state.lastDayExpenses = expenses; 

            // Job Check
            if (state.job && state.jobPerformance < 40 && Math.random() < 0.35) {
                const oldJob = state.job.name; 
                state.job = null;
                state.endgameStats.finalJob = null;
                window.queueModal("TERMINATED", `Fired from ${oldJob}. Performance below 40%.`, "Accept", "❌");
            }
            
            // App Check
            state.appliedJobs.forEach(app => { 
                if (app.status === 'pending') { 
                    const job = window.JOB_BANK.find(j => j.id === app.jobId);
                    if (app.autoReject) app.status = 'declined'; 
                    else if (Math.random() > 0.6) { app.status = 'interview'; window.queueModal("Update", `${job.name} wants an interview!`, "Board", "🤝"); }
                } 
            });

            state.step = 'day_summary'; 
            window.updateUI();
        };

            window.checkForMorningEvents();
        };

        window.getEndgameNarrative = function(stats) {
            const allPersonas = [
                ...window.PERSONA_DATA.surreal,
                ...window.PERSONA_DATA.funny,
                ...window.PERSONA_DATA.mundane
            ];

            const playerStats = {
                gpa: (state.grades / 100) * 4.0,
                money: state.balance,
                stress: stats.averageStress,
                energy: stats.averageEnergy,
                friendships: stats.friendshipsMade,
                inventorySize: state.purchasedItems.length,
                jobPerformance: state.jobPerformance,
                accepted: state.committedCollege !== null,
                has_console: state.purchasedItems.includes('console'),
                has_acorn: state.purchasedItems.includes('acorn'),
                friend_jeff: window.hasActiveFriend('jeff'),
                accepted_yale_jr: state.committedCollege ? state.committedCollege.id === 'yale_jr' : false,
                collegeName: state.committedCollege ? window.COLLEGE_DB.find(c => c.id === state.committedCollege.id).name : "a local community college"
            };

            for (const persona of allPersonas) {
                let match = true;
                for (const key in persona.conditions) {
                    const conditionValue = persona.conditions[key];
                    const playerValue = playerStats[key];

                    if (typeof conditionValue === 'boolean' || typeof conditionValue === 'string') {
                        if (playerValue !== conditionValue) { match = false; break; }
                    } else if (typeof conditionValue === 'number') {
                        if (playerValue === undefined || playerValue < conditionValue) { match = false; break; }
                    }
                }
                if (match) {
                    let narrativeText = persona.narrative.replace('{collegeName}', playerStats.collegeName);
                    return { ...persona, narrative: narrativeText };
                }
            }

            return { 
                title: "The Survivor", 
                icon: "👍",
                narrative: "You finished high school. It wasn't always pretty, but you made it out in one piece. The future is an unwritten book, and the pen is in your hand."
            };
        };

        window.renderEndgameRecap = function() {
            // Final calculations
            const es = state.endgameStats;
            es.averageStress = es.totalStress / es.dayCount;
            es.averageEnergy = es.totalEnergy / es.dayCount;
            es.friendshipsMade = Object.values(state.relationships).filter(r => r.status === 'active').length;
            es.burnoutCount = state.burnoutCount;
            es.finalGpa = (state.grades / 100) * 4.0;
            es.totalItemsPurchased = state.purchasedItems.length;

            const persona = window.getEndgameNarrative(es);

            const screen = document.getElementById('game-screen');
            screen.innerHTML = `
                <div class="flex flex-col h-full animate-pop text-left">
                    <div class="text-center mb-6 flex-shrink-0">
                        <h2 class="text-3xl font-black mb-1 uppercase italic text-center text-acs-gold leading-none">Where Are They Now?</h2>
                        <p class="text-slate-400 font-bold uppercase text-xs text-center">Final Results</p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-4xl mx-auto w-full flex-grow items-start overflow-hidden">
                        
                        <!-- Left Col: Persona -->
                        <div class="glass-panel p-6 rounded-[2rem] border-2 border-indigo-500/50 shadow-xl h-full flex flex-col text-center justify-center">
                            <div class="text-7xl mb-4">${persona.icon}</div>
                            <h3 class="text-2xl font-black uppercase text-acs-gold mb-2 tracking-widest">${persona.title}</h3>
                            <p class="text-slate-300 text-sm leading-relaxed">${persona.narrative}</p>
                        </div>

                        <!-- Right Col: Stats -->
                        <div class="glass-panel p-6 rounded-[2rem] border-2 border-slate-700 shadow-lg h-full flex flex-col">
                            <h3 class="text-[14px] font-black uppercase text-acs-gold mb-4 tracking-widest text-center">Final Report</h3>
                            <div class="space-y-2 overflow-y-auto pr-2 creator-scroll flex-grow text-xs uppercase font-bold">
                                <div class="flex justify-between p-2 rounded bg-slate-800/50"><span>Final GPA:</span><span class="font-black text-blue-400">${es.finalGpa.toFixed(2)}</span></div>
                                <div class="flex justify-between p-2 rounded bg-slate-800/50"><span>Final Balance:</span><span class="font-black text-green-400">$${state.balance.toFixed(2)}</span></div>
                                <div class="flex justify-between p-2 rounded bg-slate-800/50"><span>Avg. Stress:</span><span class="font-black text-red-400">${es.averageStress.toFixed(0)}%</span></div>
                                <div class="flex justify-between p-2 rounded bg-slate-800/50"><span>Avg. Energy:</span><span class="font-black text-green-400">${es.averageEnergy.toFixed(0)}%</span></div>
                                <div class="flex justify-between p-2 rounded bg-slate-800/50"><span>College:</span><span class="font-black text-white">${state.committedCollege ? window.COLLEGE_DB.find(c=>c.id === state.committedCollege.id).name : 'None'}</span></div>
                                <div class="flex justify-between p-2 rounded bg-slate-800/50"><span>Final Job:</span><span class="font-black text-white">${state.job ? state.job.name : 'Unemployed'}</span></div>
                                <div class="flex justify-between p-2 rounded bg-slate-800/50"><span>Friendships:</span><span class="font-black text-pink-400">${es.friendshipsMade}</span></div>
                                <div class="flex justify-between p-2 rounded bg-slate-800/50"><span>Items Owned:</span><span class="font-black text-white">${es.totalItemsPurchased}</span></div>
                                <div class="flex justify-between p-2 rounded bg-slate-800/50"><span>Burnouts:</span><span class="font-black text-orange-400">${es.burnoutCount}</span></div>
                            </div>
                        </div>
                    </div>

                    <div class="text-center mt-6 flex-shrink-0">
                        <button onclick="window.location.reload()" class="bg-indigo-600 hover:text-white px-12 py-4 rounded-2xl font-black uppercase tracking-[0.2em] shadow-xl hover:bg-indigo-700 hover:scale-105 transition-all text-sm">
                            Play Again
                        </button>
                    </div>
                </div>
            `;
        };

        window.onload = window.updateUI;

        // AUTOPLAY FIX: Wait for first interaction to start audio
            const initAudio = () => {
                window.manageBackgroundAudio();
                // Clean up listeners so it doesn't fire constantly
                document.removeEventListener('click', initAudio);
                document.removeEventListener('keydown', initAudio);
            };
            
            document.addEventListener('click', initAudio);
            document.addEventListener('keydown', initAudio);
        

        // --- GLOBAL AUDIO SYSTEM ---
        
        // Track the last element hovered to prevent sound spamming while moving inside one button
        let lastHoveredElement = null;

        // 1. CLICK SOUNDS
        document.addEventListener('click', (e) => {
            const target = e.target.closest('button, .card-select, .job-card, .draggable-trash, .draggable-ing');
            
            if (target && !target.disabled && !target.classList.contains('cursor-not-allowed')) {
                const sfx = new Audio('audio/click.ogg'); 
                sfx.volume = 0.3; // Click volume
                sfx.play().catch(() => {});
            }
        });

        // 2. HOVER SOUNDS
        document.addEventListener('mouseover', (e) => {
            // Check for interactive elements
            const target = e.target.closest('button, .card-select, .job-card, .draggable-trash, .draggable-ing');

            // If we are over a valid target AND it's different from the last one we saw
            if (target && target !== lastHoveredElement) {
                if (!target.disabled && !target.classList.contains('cursor-not-allowed')) {
                    const sfx = new Audio('audio/hover.ogg'); 
                    sfx.volume = 0.1; // Hover should be quieter than click
                    sfx.play().catch(() => {});
                }
                // Update tracker
                lastHoveredElement = target;
            } 
            // If we moved off a button into empty space
            else if (!target) {
                lastHoveredElement = null;
            }
        });
    </script>
</body>
</html>
