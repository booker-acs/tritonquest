        @font-face {
            font-family: 'Outfit';

            font-weight: 100 900;
            font-style: normal;
        }
        /* 1. Define the custom font */
        @font-face {
            font-family: 'CustomEmoji';
            src: url('fonts/seguiemj.ttf') format('truetype');
            /* Note: adjust the path to wherever you saved the font! */
        }

        /* 2. Tell the whole game to prioritize this font for emojis */
        body {
            /* Standard font first, fallback to our CustomEmoji font! */
            font-family: ui-sans-serif, system-ui, sans-serif, 'CustomEmoji'; 
        }
        /* Marquee Animation for Music Player */
        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .animate-marquee {
            display: inline-block;
            animation: marquee 8s linear infinite;
        }
        :root {
            --acs-navy: #002147;
            --acs-gold: #FDB913;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--acs-navy);
            color: #ffffff;
            overflow-x: hidden;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(253, 185, 19, 0.2);
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.5);
        }

        .text-acs-gold { color: var(--acs-gold); }
        .text-acs-navy { color: var(--acs-navy); }
        .bg-acs-gold { background-color: var(--acs-gold); }
        .bg-acs-navy { background-color: var(--acs-navy); }
        .border-acs-gold { border-color: var(--acs-gold); }

        .card-select {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            border: 2px solid transparent;
            background-color: rgba(30, 41, 59, 0.8);
        }
        .card-select:hover { transform: translateY(-3px); border-color: var(--acs-gold); }
        .card-select.active { border-color: var(--acs-gold); background-color: rgba(253, 185, 19, 0.1); }
        .card-select.active-neg { border-color: #ef4444; background-color: rgba(239, 68, 68, 0.1); }

        .interview-bubble {

            background: #1e293b;

            color: white;
        }

        .interview-bubble::after {
            content: '';
            position: absolute; bottom: -10px; left: 20px;
            border-width: 15px 15px 0; border-style: solid;
            border-color: #1e293b transparent;
        }

        // NEW: Helper to ensure content doesn't repeat until exhausted
        window.getUnseenItem = function(pool, seenList, identifierKey = null) {
            // Filter pool to find items whose ID (or index) is NOT in seenList
            let availableIndices = pool.map((_, index) => index).filter(index => {
                const item = pool[index];
                const id = identifierKey ? item[identifierKey] : (typeof item === 'string' ? item : index);
                return !seenList.includes(id);
            });

            // If we've seen everything, reset the seen list and make everything available again
            if (availableIndices.length === 0) {
                seenList.length = 0; // Clear array in place
                availableIndices = pool.map((_, index) => index);
            }

            // Pick a random index from the available ones
            const chosenIndex = availableIndices[Math.floor(Math.random() * availableIndices.length)];
            const chosenItem = pool[chosenIndex];
            
            // Mark as seen
            const idToStore = identifierKey ? chosenItem[identifierKey] : (typeof chosenItem === 'string' ? chosenItem : chosenIndex);
            seenList.push(idToStore);

            return chosenItem;
        };

        window.calculateCollegeChance = function(college) {
            let score = 0;
            const playerGPA = (state.grades / 100) * 4.0;
            const diff = playerGPA - college.minGPA;

            // 1. GPA Analysis
            if (diff >= 0.5) score += 60;       // Way above average
            else if (diff >= 0.2) score += 40;  // Solidly above
            else if (diff >= 0) score += 20;    // Just met requirements
            else if (diff >= -0.2) score -= 10; // Slightly below
            else score -= 50;                   // Way below (Hard Reach)

            // 2. Academy Synergy (Big Boost)
            // 'general' colleges accept any academy
            if (state.academy) {
                const academyType = {
                    'health': 'health', 'stem': 'stem', 'media': 'arts', 'business': 'business', 'teaching': 'teaching'
                }[state.academy];

                if (college.type === academyType) score += 25;
                else if (college.type === 'general') score += 10;
            }

            // 3. AP Classes (Rigor)
            score += (state.apClasses.length * 10);

            // 4. Clubs (Extracurriculars)
            score += (state.clubMemberships.length * 5);

            // 5. Traits
            if (state.traits.includes('techie') && college.type === 'stem') score += 15;
            if (state.skill === 'fast') score += 10;
            if (state.negativeTrait === 'distracted') score -= 5;

            // 6. Tier Difficulty Adjustment
            // Elite schools are harder even with good stats
            if (college.tier === 1) score -= 30; 
            if (college.tier === 2) score -= 10;
            if (college.tier === 4 || college.tier === 5) score += 20; // Community/Trade easier to get in

            // Clamp 0-100 (technically chance percentage)
            // Base chance is 20% just for applying
            let totalChance = 20 + score;
            totalChance = Math.max(0, Math.min(99, totalChance));

            // Determine Label
            let label = "Target";
            let color = "bg-yellow-500/20 text-yellow-400 border-yellow-500/50";

            if (totalChance >= 85) {
                label = "Safety";
                color = "bg-green-500/20 text-green-400 border-green-500/50";
            } else if (totalChance <= 40) {
                label = "Reach";
                color = "bg-red-500/20 text-red-400 border-red-500/50";
            }

            return { chance: totalChance, label, color };
        };

    window.startStandardEvent = function(evt) {
    // --- 1. BULK TAG FILTERING ---
    // Check if the current event is invalid for today's state
    let isInvalid = false;
    if (evt.req === 'school' && !state.hasAttendedSchoolToday) isInvalid = true;
    if (evt.req === 'work' && !state.hasWorkedToday) isInvalid = true;
    if (evt.type === 'jeff' && !window.hasActiveFriend('jeff')) isInvalid = true;
    if (evt.type === 'jeff' && state.jeffreyArcComplete) isInvalid = true;

    // If invalid, filter the DB to ONLY valid events and reroll once to prevent infinite loops
    if (isInvalid) {
        let validEvents = window.DAILY_EVENT_DB.filter(e => {
            if (e.req === 'school' && !state.hasAttendedSchoolToday) return false;
            if (e.req === 'work' && !state.hasWorkedToday) return false;
            if (e.req === 'jeff' && !window.hasActiveFriend('jeff')) return false;
            if (e.req === 'jeff' && state.jeffreyArcComplete) return false;
            return true;
        });

        if (validEvents.length > 0) {
            let newEvt = validEvents[Math.floor(Math.random() * validEvents.length)];
            window.startStandardEvent(newEvt); 
            return; // Stop current execution, let the reroll handle it
        }
    }

    // --- 2. SUMMER MINIGAME INTERCEPT ---
    // If it's summer vacation AND a minigame was rolled, bypass the normal minigames and play a Summer game!
    if (state.isSummerVacation && evt.type === 'minigame') {
        if (typeof window.triggerSummerMinigame === 'function') {
            window.triggerSummerMinigame();
            return; 
        }
    }

    // --- 3. APPLY STATS HELPER ---
    const applyAndReport = (effects) => {
        let html = `<div class="mt-4 border-t border-slate-600 pt-4 font-bold text-sm">`;
        
        if (effects.cash) {
            state.balance += effects.cash;
            state.dayStats.cash += effects.cash;
            if (effects.cash > 0) {
                state.endgameStats.totalMoneyEarned += effects.cash;
            } else {
                state.endgameStats.totalMoneySpent -= effects.cash;
            }
            const color = effects.cash > 0 ? 'text-green-400' : 'text-red-400';
            html += `<div class="${color} flex justify-between"><span>Money</span><span>${effects.cash > 0 ? '+' : ''}$${effects.cash.toFixed(2)}</span></div>`;
        }
        if (effects.stress) {
            state.stress = Math.max(0, Math.min(100, state.stress + effects.stress));
            state.dayStats.stress += effects.stress;
            const color = effects.stress < 0 ? 'text-green-400' : 'text-red-400';
            html += `<div class="${color} flex justify-between"><span>Stress</span><span>${effects.stress > 0 ? '+' : ''}${effects.stress}%</span></div>`;
        }
        if (effects.energy) {
            state.energy = Math.max(0, Math.min(100, state.energy + effects.energy));
            state.dayStats.energy += effects.energy;
            const color = effects.energy > 0 ? 'text-green-400' : 'text-red-400';
            html += `<div class="${color} flex justify-between"><span>Energy</span><span>${effects.energy > 0 ? '+' : ''}${effects.energy}%</span></div>`;
        }
        if (effects.grades) {
            state.grades = Math.max(0, Math.min(100, state.grades + effects.grades));
            state.dayStats.grades += effects.grades;
            const color = effects.grades > 0 ? 'text-green-400' : 'text-red-400';
            html += `<div class="${color} flex justify-between"><span>GPA</span><span>${effects.grades > 0 ? '+' : ''}${effects.grades}%</span></div>`;
        }
        if (effects.hungerSet !== undefined) {
            state.hungerLevel = effects.hungerSet;
            const color = effects.hungerSet === 2 ? 'text-green-400' : 'text-red-400';
            const text = effects.hungerSet === 2 ? 'Full' : (effects.hungerSet === 1 ? 'Fine' : 'Starving');
            html += `<div class="${color} flex justify-between"><span>Hunger</span><span>${text}</span></div>`;
        }
        if (effects.grantAcorn) {
            state.hasAcorn = true;
            if (!state.purchasedItems.includes('acorn')) {
                state.purchasedItems.push('acorn');
            }
            if (typeof window.syncInventoryLayout === 'function') window.syncInventoryLayout();
            html += `<div class="text-amber-400 flex justify-between"><span>Item Acquired</span><span>Golden Acorn</span></div>`;
        }

        html += `</div>`;
        return html;
    };

    // --- 4. NPC UNLOCK MAPPER ---
    const handleUnlock = (id, choiceLabel) => {
        if (id === 'crushtext') window.unlockContact('crush');
        if (id === 'dreamteam') window.unlockContact('sawyer');
        if (id === 'bluescreen') window.unlockContact('matheus');
        if (id === 'yondr' && choiceLabel === 'Do it') window.unlockContact('jeff');
        if (id === 'viralvideo') window.unlockContact('ophelia');
        
    };

    // --- 5. EVENT TYPE ROUTER ---
    if (evt.type === 'passive') {
        window.queueModal(evt.title, evt.text, evt.btn, evt.icon, () => {
            const statsHtml = applyAndReport(evt.effects);
            handleUnlock(evt.id, null);

            if (evt.id === 'ultimatetriton') {
                state.completedUltimateTriton = true;
                window.tryUnlockKingTriton();
            }
 
            window.queueModal(evt.title, evt.result + statsHtml, "Okay", evt.icon, () => window.finalizeDay(), null, false, "DAILY EVENT");
        }, null, false, "DAILY EVENT");
    }
    else if (evt.type === 'choice') {
        window.queueModal(evt.title, evt.text, evt.choices[0].label, evt.icon, (choiceA) => {
            let selected = choiceA ? evt.choices[0] : evt.choices[1];
            const statsHtml = applyAndReport(selected.effects);
            handleUnlock(evt.id, selected.label); 
            window.queueModal(selected.resultTitle, selected.resultText + statsHtml, "Okay", evt.icon, () => window.finalizeDay(), null, false, "DAILY EVENT");
        }, evt.choices[1].label, false, "DAILY EVENT");
    }
    else if (evt.type === 'minigame') {
        // Normal minigame fallback (if not summer)
        if (typeof window[evt.func] === 'function') {
            window[evt.func]();
        } else {
            console.warn("Minigame function missing:", evt.func);
            if (typeof window.finalizeDay === 'function') window.finalizeDay();
        }
    }
};

        window.calculateJobScore = function(job) {
            let score = 0; // Base is now 0 (Neutral)

            // --- POSITIVE TRAITS ---
            if (state.traits.includes('reliable')) score += 5; // Generic small boost
            
            if (state.traits.includes('outgoing')) {
                if (['retail', 'food', 'daycare'].includes(job.type)) score += 20;
                if (['tech', 'labor'].includes(job.type)) score -= 15; // Penalty for desk/solo work
            }
            
            if (state.traits.includes('organized')) {
                if (['tech', 'daycare'].includes(job.type)) score += 15;
                if (job.type === 'labor') score -= 5;
            }

            if (state.traits.includes('techie')) {
                if (job.type === 'tech') score += 30; // Instant qualification
                if (['labor', 'food'].includes(job.type)) score -= 10;
            }

            if (state.traits.includes('patient')) {
                if (['daycare', 'animal'].includes(job.type)) score += 20;
                if (job.type === 'retail') score += 10;
            }

            // --- NEGATIVE TRAITS (Heavy Penalties) ---
            if (state.negativeTrait === 'shy') {
                if (['retail', 'food'].includes(job.type)) score -= 30; // Severe penalty
                if (['daycare', 'labor'].includes(job.type)) score -= 10;
            }

            if (state.negativeTrait === 'clumsy') {
                if (['labor', 'food', 'tech'].includes(job.type)) score -= 25; // Dangerous
            }

            if (state.negativeTrait === 'messy') {
                if (['food', 'animal', 'daycare'].includes(job.type)) score -= 20;
            }
            
            if (state.negativeTrait === 'distracted') {
                if (['tech', 'labor'].includes(job.type)) score -= 15; // Precision matters
            }

            if (state.negativeTrait === 'sleepy') {
                if (['labor'].includes(job.type)) score -= 15; // Physical labor is hard when tired
            }

            // --- MAJOR SKILL SYNERGY ---
            if (state.skill === 'customer' && ['retail', 'food'].includes(job.type)) score += 15;
            if (state.skill === 'code' && job.type === 'tech') score += 15;
            if (state.skill === 'aid' && ['daycare', 'animal'].includes(job.type)) score += 15;
            if (state.skill === 'fast') score += 5; // General slight boost

            return score;
        };

            const pinnedObjects = allJobs.filter(j => pinnedJobIds.includes(j.id));
            const otherJobs = allJobs.filter(j => !pinnedJobIds.includes(j.id)).sort(() => 0.5 - Math.random());
            state.visibleJobs = [...pinnedObjects, ...otherJobs].slice(0, 5);
        };

        window.changeGameTrack = function(specificUrl, isHoliday) {
            // Stop existing
            if (state.gameLoopAudio) {
                state.gameLoopAudio.pause();
            }

            // Determine URL
            let url = specificUrl;
            if (!url) {
                // Pick random normal track
                url = window.MENU_MUSIC_PLAYLIST[Math.floor(Math.random() * window.MENU_MUSIC_PLAYLIST.length)];
            }

            // Setup Audio
            state.gameLoopAudio = new Audio(url);
            state.gameLoopAudio.volume = 0.2;
            state.gameLoopAudio.customIsHoliday = isHoliday; // Flag to track type

            // End Behavior
            state.gameLoopAudio.onended = () => {
                if (isHoliday) {
                    // Holidays loop the same track
                    state.gameLoopAudio.play().catch(()=>{});
                } else {
                    // Normal days shuffle to next track
                    window.changeGameTrack(null, false);
                }
            };

            state.gameLoopAudio.play().catch(e => {});
        };

                        window.manageBackgroundAudio = function() {
            const isIntro = ['start', 'creator', 'goal'].includes(state.step);
            const isPearPodsActive = state.currentAudio !== null;

            // If PearPods are active, they take precedence. Ensure other tracks are paused.
            if (isPearPodsActive) {
                if (state.gameLoopAudio && !state.gameLoopAudio.paused) state.gameLoopAudio.pause();
                if (state.introAudio && !state.introAudio.paused) state.introAudio.pause();
                return;
            }

            // If we are in the intro scenes
            if (isIntro) {
                if (state.gameLoopAudio && !state.gameLoopAudio.paused) state.gameLoopAudio.pause();
                if (!state.introAudio) {
                    state.introAudio = new Audio('audio/intro.ogg');
                    state.introAudio.loop = true;
                    state.introAudio.volume = 0.4;
                }
                if (state.introAudio.paused) {
                    state.introAudio.play().catch(e => {});
                }
                return;
            }

            // If we are in the main game (not intro, not pearpods)
            if (state.introAudio && !state.introAudio.paused) {
                state.introAudio.pause();
            }

            const season = window.SEASONS[state.currentSeasonIndex];
            const holiday = window.HOLIDAYS[season]?.[state.dayOfMonth];
            const targetHolidayFile = (holiday && holiday.audioFile) ? holiday.audioFile : null;

            const currentTrackSrc = state.gameLoopAudio ? state.gameLoopAudio.src : '';
            const isHolidayTrackPlaying = state.gameLoopAudio ? state.gameLoopAudio.customIsHoliday : false;

            // Case 1: It's a holiday, but the holiday track isn't playing.
            if (targetHolidayFile && !currentTrackSrc.includes(targetHolidayFile)) {
                window.changeGameTrack(targetHolidayFile, true);
            } 
            // Case 2: It's not a holiday, but a holiday track is playing OR no track is playing at all.
            else if (!targetHolidayFile && (isHolidayTrackPlaying || !state.gameLoopAudio)) {
                window.changeGameTrack(null, false);
            }
            // Case 3: A track exists but is paused (e.g., returning from a minigame).
            else if (state.gameLoopAudio && state.gameLoopAudio.paused) {
                state.gameLoopAudio.play().catch(e => {});
            }
        };

        window.openContactsMenu = function() {
            // Safety check for older save files
            if (!state.relationships) state.relationships = {};

            const ids = Object.keys(state.relationships);
            let listHtml = '';

            if (ids.length === 0) {
                listHtml = `<div class="text-center text-slate-500 italic py-8 border-t border-slate-700 mt-4">You haven't made any close connections yet. Trigger specific daily events to meet people.</div>`;
            } else {
                listHtml = `<div class="grid grid-cols-1 gap-3 max-h-[50vh] overflow-y-auto pr-2 custom-scroll mt-4 border-t border-slate-700 pt-4">`;
                
                ids.forEach(id => {
                    const rel = state.relationships[id];
                    const data = window.NPC_DB[id];

                    // Safety Check
                    if (!data) return;
                    
                    // 1. Status Logic
                    let statusColor = "text-green-400";
                    let statusText = "Active";
                    
                    // Standard Decay
                    if (rel.daysSinceInteraction > 5) { statusColor = "text-yellow-400"; statusText = "Drifting"; }
                    if (rel.daysSinceInteraction > 10) { statusColor = "text-red-500"; statusText = "Ghosted"; }
                    if (rel.status === 'ghosted') { statusColor = "text-slate-600"; statusText = "Ghosted"; }
                    
                    // Special Crush States
                    if (id === 'crush') {
                        if (rel.status === 'broken_up') { 
                            statusColor = "text-slate-500"; 
                            statusText = "Ex"; 
                        } else if (rel.status === 'toxic') { 
                            statusColor = "text-purple-400 animate-pulse"; 
                            statusText = "Toxic"; 
                        }
                    }

                    // 2. Portrait Logic (The missing link!)
                    const artKey = `${id}_portrait`;
                    const portraitHtml = (window.GAME_ART && window.GAME_ART[artKey]) 
                        ? window.GAME_ART[artKey] 
                        : `<div class="text-3xl bg-slate-700 w-12 h-12 flex items-center justify-center rounded-full border border-slate-500 flex-shrink-0 select-none">${data.icon}</div>`;

                    // 3. Button Logic
                    let actionBtn = '';
                    // Only show Hang Out if not ghosted/broken up
                    if (rel.status !== 'ghosted' && rel.status !== 'broken_up') {
                        actionBtn = `<button onclick="window.hangOut('${id}')" class="px-3 py-1.5 bg-indigo-600 text-white text-[10px] font-bold uppercase rounded-lg shadow hover:bg-indigo-500 transition-all">Hang Out</button>`;

                        if (id === 'crush' && rel.status === 'toxic') {
                            actionBtn += `<button onclick="window.breakUp()" class="mt-2 px-3 py-1.5 bg-red-600 text-white text-[10px] font-bold uppercase rounded-lg shadow hover:bg-red-500 transition-all">Break Up</button>`;
                        }
                    }

                    listHtml += `
                        <div class="bg-slate-800 p-4 rounded-xl border border-slate-600 flex items-center justify-between text-left">
                            <div class="flex items-center gap-4">
                                ${portraitHtml}
                                <div>

                            <div class="text-right flex flex-col items-end gap-1 flex-shrink-0">
                                <div class="text-[10px] font-black uppercase tracking-widest ${statusColor} mb-1">${statusText}</div>
                                ${actionBtn}
                            </div>
                        </div>
                    `;
                });
                listHtml += `</div>`;
            }

            window.queueModal(

    window.hangOut = function(id) {
    // Energy Check
    if (state.energy < 20) {
        document.getElementById('modal-overlay').classList.add('hidden');
        window.queueModal("Too Tired", "You need at least 20 Energy to hang out.", "Okay", "💤", () => window.openContactsMenu());
         return;
    }
    
    // Close menu
    document.getElementById('modal-overlay').classList.add('hidden');
    
    // Pay Energy Cost Upfront
    state.energy -= 20;
    state.dayStats.energy -= 20;

    // Select Random Game
    const games = ['dap', 'yap', 'handshake', 'aux', 'photo'];
    const selectedGame = games[Math.floor(Math.random() * games.length)];
    
    // Route
    if (selectedGame === 'dap') window.startDapGame(id);
    else if (selectedGame === 'yap') window.startYapGame(id);
    else if (selectedGame === 'handshake') window.startHandshakeGame(id);
    else if (selectedGame === 'aux') window.startAuxGame(id);
    else if (selectedGame === 'photo') window.startPhotoGame(id);
};

                statHtmlContent = `<span class="text-slate-400 text-xs">Session Active...</span>`;
            } else {
                // New Session
                if (state.pearPodUsage >= pearPodLimit) {

                    track = window.getUnseenItem(PEAR_POD_PLAYLIST, state.seenSongs, 'song');

                // Stop all other sounds before playing
                window.stopAllAudio();
                
                state.currentAudio = new Audio(track.file);
                state.currentAudio.volume = 0.5;
                state.currentAudio.customTrackData = track; 
                
                // Apply Stats
                state.pearPodUsage++;
                state.stress = Math.max(0, state.stress - 15); 
                state.dayStats.stress -= 15;
            
                let msg = "Listened to music. Stress relieved.";
                let negativeDisplayHtml = "";

                if (state.isSchoolDay && !state.hasAttendedSchoolToday) {
                    state.grades = Math.max(0, state.grades - 2.0); 
                    msg += " Distracted study (-0.1 GPA).";
                    negativeDisplayHtml = `<span class="text-red-400 ml-2">GPA -0.1</span>`;
                }

                if (state.job && state.hasAttendedSchoolToday) {
                    state.jobPerformance = Math.max(0, state.jobPerformance - 1); 
                    msg += " Zoned out at work (-1% Perf).";
                    negativeDisplayHtml = `<span class="text-red-400 ml-2">Perf -1%</span>`;

                state.log.unshift(msg);

                window.updateUI({scroll: false, animate: false}); 
                
                statHtmlContent = `<span class="text-green-400">Stress -15%</span>${negativeDisplayHtml}`;
                
                state.currentAudio.play().catch(e => console.log("Audio play failed:", e));

                    state.currentAudio = null;
                    window.manageBackgroundAudio(); 
                    window.updateUI();

            const hasHotify = state.subscriptions.includes('hotify');
            const controlClass = hasHotify ? "hover:text-white cursor-pointer transition-colors" : "opacity-30 cursor-not-allowed";

                    <div class="flex items-center gap-4 mb-4">
                        <div class="w-16 h-16 bg-gradient-to-br from-green-400 to-slate-700 rounded-lg flex items-center justify-center text-3xl shadow-lg border border-slate-500 animate-pulse">🎵</div>

                </div>

                <div class="grid grid-cols-2 gap-3">
                    <button id="btn-keep-listening" class="w-full py-4 bg-acs-gold text-acs-navy rounded-2xl font-black uppercase tracking-widest shadow-xl hover:bg-white transition-all text-[10px] sm:text-xs">Keep Listening</button>
                    <button id="btn-disconnect" class="w-full py-4 bg-acs-gold text-acs-navy rounded-2xl font-black uppercase tracking-widest shadow-xl hover:bg-white transition-all text-[10px] sm:text-xs opacity-80 hover:opacity-100">Disconnect</button>
                </div>
            `;

            // Queue Modal
            state.pendingModals.push({
                title: "Connected <div class='text-6xl mt-4'>🎧</div>",
                text: playerHtml,
                icon: "", 
                superHeader: "BLUETOOTH", 
                showCloseX: false,
                choices: null, 
                buttonText: null, 
                onOpen: () => {
                    // --- HELPER: BIND AUDIO EVENTS ---
                    const bindAudioEvents = (audioObj) => {
                        const fill = document.getElementById('pp-progress-fill');
                        const curr = document.getElementById('pp-current-time');
                        const dur = document.getElementById('pp-duration');
                        
                        const format = (s) => {
                            if (isNaN(s)) return "0:00";
                            const m = Math.floor(s / 60);
                            const sec = Math.floor(s % 60);
                            return `${m}:${sec < 10 ? '0' : ''}${sec}`;
                        };

                        if (audioObj.duration && dur) dur.innerText = format(audioObj.duration);

                        audioObj.ontimeupdate = () => {
                            if (fill && document.body.contains(fill) && audioObj.duration) {
                                const pct = (audioObj.currentTime / audioObj.duration) * 100;
                                fill.style.width = `${pct}%`;
                                if(curr) curr.innerText = format(audioObj.currentTime);
                            }
                        };

                        audioObj.onloadedmetadata = () => {
                            if (dur && document.body.contains(dur)) dur.innerText = format(audioObj.duration);
                        };
                        
                        audioObj.onended = () => {
                            state.currentAudio = null;
                            window.manageBackgroundAudio(); 
                            window.updateUI();
                        };

                    if (state.currentAudio) bindAudioEvents(state.currentAudio);

                    const playBtn = document.getElementById('pp-play-btn');

                        if (playBtn && state.currentAudio) {

                    updateIcon();

                            if (state.currentAudio.paused) {
                                window.stopAllAudio(); // Stop other sounds before resuming
                                state.currentAudio.play().catch(()=>{});
                            } else {
                                state.currentAudio.pause();
                            }
                            updateIcon();
                        }
                    };

                    // --- HOTIFY CHANGE TRACK ---
                    const changeTrack = () => {
                        if (!hasHotify) return;
                        
                        window.stopAllAudio(); // Stop current track fully

                        let newTrack = window.getUnseenItem(PEAR_POD_PLAYLIST, state.seenSongs, 'song');
                        
                        state.currentAudio = new Audio(newTrack.file);
                        state.currentAudio.volume = 0.5;
                        state.currentAudio.customTrackData = newTrack;
                        
                        document.getElementById('pp-song-title').innerText = newTrack.song;

                        document.getElementById('pp-current-time').innerText = "0:00";
                        document.getElementById('pp-progress-fill').style.width = "0%";
                        
                        bindAudioEvents(state.currentAudio);
                        state.currentAudio.play().catch(()=>{});
                        updateIcon();
                    };

                    if (hasHotify) {
                        const nextBtn = document.getElementById('pp-next-btn');
                        const prevBtn = document.getElementById('pp-prev-btn');
                        if (nextBtn) nextBtn.onclick = changeTrack;
                        if (prevBtn) prevBtn.onclick = changeTrack;
                    }
                }
            });
            
            window.processModalQueue();
        };
        

        // --- SAVE SYSTEM HELPERS ---
        window.SAVE_KEY = "triton_quest_saves";

        window.getSaves = function() {
            try {
                const raw = localStorage.getItem(window.SAVE_KEY);
                return raw ? JSON.parse(raw) : {};
            } catch (e) {
                console.warn("Save system not available:", e);
                return {}; 
            }
        };

        window.doSave = function(name) {
            try {
                const saves = window.getSaves();
                // Timestamp
                state.saveTimestamp = new Date().toLocaleString();
                state.saveName = name;
                
                saves[name] = state;
                localStorage.setItem(window.SAVE_KEY, JSON.stringify(saves));
                
                document.getElementById('modal-overlay').classList.add('hidden');
                setTimeout(() => {
                    window.queueModal("GAME SAVED", `Progress saved to slot: <strong>${name}</strong>`, "Okay", "💾");
                }, 100);
            } catch (e) {
                window.queueModal("ERROR", "Could not save game. Storage might be disabled.", "Okay", "❌");
            }
        };

        window.doLoad = function(name) {
            const saves = window.getSaves();
            if (saves[name]) {
                // 1. STOP CURRENT MUSIC (Fix)
                if (state.gameLoopAudio) {
                    state.gameLoopAudio.pause();
                    state.gameLoopAudio = null;
                }
                if (state.introAudio) {
                    state.introAudio.pause();
                    // Don't null introAudio as it might be reused if we quit to menu, 
                    // but pausing it is enough.
                }
                if (state.currentAudio) {
                    state.currentAudio.pause();
                    state.currentAudio = null;
                }

                // 2. Overwrite State
                state = saves[name];
                if (typeof state.bankBalance === 'undefined') state.bankBalance = 0.00;
                
                // 3. Cleanup Intervals (from previous state)
                if (window.paddleData && window.paddleData.interval) clearInterval(window.paddleData.interval);
                if (window.consoleData && window.consoleData.interval) clearInterval(window.consoleData.interval);
                if (window.tripData && window.tripData.interval) clearInterval(window.tripData.interval);
                // (Add other minigame intervals here if needed)
                
                // 4. Reset Audio Handles in New State
                // Since audio objects don't save to JSON, the loaded state has them as null/undefined.
                // We ensure they are null so the manager re-creates them fresh.
                state.currentAudio = null;
                state.introAudio = null;
                state.gameLoopAudio = null;
                
                // 5. UI Refresh
                document.getElementById('modal-overlay').classList.add('hidden');
                setTimeout(() => {
                    window.manageBackgroundAudio(); // Will start fresh music based on loaded state
                    window.updateUI();
                    window.queueModal("LOADED", `Welcome back, ${state.playerName}.`, "Resume", "👋");
                }, 100);
            }
        };

        window.deleteSave = function(name) {
            // 1. Close the current Save Menu so the Confirmation modal can appear
            document.getElementById('modal-overlay').classList.add('hidden');

            // 2. Queue Confirmation with a slight delay
            setTimeout(() => {
                window.queueModal(
                    "DELETE SAVE?", 
                    `Are you sure you want to permanently delete <strong>${name}</strong>? This cannot be undone.`, 
                    "Delete", 
                    "🗑️", 
                    (confirmed) => {
                        if (confirmed) {
                            const saves = window.getSaves();
                            delete saves[name];
                            localStorage.setItem(window.SAVE_KEY, JSON.stringify(saves));
                        }
                        // Re-open the menu (refreshed) whether confirmed or cancelled
                        window.openSaveMenu(); 
                    }, 
                    "Cancel"
                );
            }, 100);
        };

        window.startApply = function(id) {
            document.getElementById('modal-overlay').classList.add('hidden');
            if (state.energy < 20) { 
                window.queueModal("Exhausted", "Not enough energy to apply.", "Okay", "💤", () => window.openJobBoard()); 
                 return; 
            }
            
            // Deduct costs
            state.energy -= 20;
            state.dayStats.energy -= 20;
            
            // Set target job
            state.applyingFor = window.JOB_BANK.find(j => j.id === id);
            
            // NEW: Select 3 Unique Questions
            state.resumePool = [];
            for (let i = 0; i < 3; i++) {
                // Determine if we should prioritize specific questions later, for now random from bank
                state.resumePool.push(window.getUnseenItem(window.RESUME_QUIZ_BANK, state.seenResumeIndices));
            }

            state.resumeScore = 0;
            
            window.updateUI(); 
            
            // Trigger the first question
            setTimeout(window.triggerResumeAudit, 100);

            const q = state.resumePool[state.resumeIndex];

                action: () => window.handleResumeAnswer(i === q.correct)
            }));

            // Dynamic Header
            const stepTitle = `APPLICATION (${state.resumeIndex + 1}/3)`;
            
            window.queueChoiceModal(stepTitle, q.q, "📝", choices, "RESUME AUDIT");

                                <span class="w-8 h-8 bg-slate-700 group-hover:bg-acs-gold group-hover:text-acs-navy rounded-xl flex flex-shrink-0 items-center justify-center text-xs font-black transition-colors">${String.fromCharCode(65+i)}</span>

        window.handleResumeAnswer = function(isCorrect) {
            if (isCorrect) state.resumeScore++;
            state.resumeIndex++;

            if (state.resumeIndex < 3) {
                // Chain next question
                setTimeout(window.triggerResumeAudit, 300);
            } else {
                // FINISH APPLICATION
                
                // Logic: Need at least 2/3 correct to avoid auto-reject
                const isSuccess = state.resumeScore >= 2;
                
                state.appliedJobs.push({ 
                    jobId: state.applyingFor.id, 
                    status: 'pending', 
                    autoReject: !isSuccess // If score < 2, auto-reject is TRUE
                });

                // Feedback Modal
                let title, text, icon;
                if (state.resumeScore === 3) {
                    title = "PERFECT";
                    text = "Your application is flawless. HR will definitely see this.";
                    icon = "✨";
                } else if (state.resumeScore === 2) {
                    title = "SUBMITTED";
                    text = "Your application looks decent. Now we wait.";
                    icon = "✅";
                } else {
                    title = "FLAGGED";
                    text = "You made multiple errors. The automated system might filter you out.";
                    icon = "⚠️";
                }

                window.queueModal(
                    title, 
                    `${text} <br><br><span class="text-xs font-bold text-slate-400">Score: ${state.resumeScore}/3 Correct</span>`, 
                    "Return to Dashboard", 
                    icon, 
                    () => { 
                        state.step = 'sim_dashboard'; 
                        window.updateUI(); 
                    }
                );
            }
        };

        window.enterInterview = function(id) {

            // Weekly work-hour cap: 24 during the school year, 40 during summer break (matches finishWorkShift)
            window.getWeeklyHourCap = function() {
                const isSummerVacation = state.currentSeasonIndex === 3 && state.dayOfMonth >= 5;
                return isSummerVacation ? 40 : 24;
            };

            window.finishWorkShift = function(passed, customPerf = null, customEnergy = null, customMsg = null) {
                
                let perf = customPerf !== null ? customPerf : (passed ? 10 : -15);
                let logHtml = `<div class="text-left space-y-4 font-bold text-slate-300 text-left">`;
                
                // Custom Message from Minigame
                if (customMsg) {
                    logHtml += `<div class="bg-slate-800 p-3 rounded-lg border border-slate-600 mb-3 text-sm italic">"${customMsg}"</div>`;
                }

                // Performance Logic
                if (customPerf !== null) {
                    let color = perf >= 0 ? 'text-green-400' : 'text-red-400';
                    let sign = perf > 0 ? '+' : '';
                    logHtml += `<div class="${color} flex justify-between text-left"><span>${passed ? '✅ Task Complete' : '❌ Task Failed'}</span><span>${sign}${perf}% Rating</span></div>`;
                } else {
                    logHtml += passed ? `<div class="text-green-400 flex justify-between text-left"><span>✅ Professionalism</span><span>+10% Rating</span></div>` : `<div class="text-red-400 flex justify-between text-left"><span>❌ Workplace Error</span><span>-15% Rating</span></div>`;
                }
                
                if (state.negativeTrait === 'shy') state.stress = Math.min(100, state.stress + 5);
                if (state.energy < 50) { logHtml += `<div class="text-red-400 text-xs flex justify-between text-left"><span>⚡ Fatigue Multiplier</span><span>-10%</span></div>`; perf -= 10; }
                if (state.hungerLevel === 0) { logHtml += `<div class="text-red-400 text-xs flex justify-between text-left"><span>🍔 Nutritional Deficit</span><span>-10%</span></div>`; perf -= 10; } 
                else if (state.hungerLevel === 2) { perf += 5; }
                
                if (state.social <= 20) { perf -= 5; logHtml += `<div class="text-red-400 text-xs flex justify-between text-left"><span>💔 Lonely</span><span>-5% Rating</span></div>`; }

                state.jobPerformance = Math.max(0, Math.min(100, state.jobPerformance + perf));
                if (state.traits.includes('reliable')) state.jobPerformance = Math.max(50, state.jobPerformance);

                logHtml += `</div><hr class="my-3 border-slate-600 text-center"><div class="text-xs font-black uppercase text-center text-acs-gold text-center mb-1">Performance Impact: ${perf}%</div>`;
                
                // --- HOURS & LABOR LAW LOGIC ---
                if (typeof state.hoursWorkedThisWeek === 'undefined') state.hoursWorkedThisWeek = 0;
                
                const isSummerVacation = state.currentSeasonIndex === 3 && state.dayOfMonth >= 5;
                const isWeekend = state.dayIndex >= 5 && !isSummerVacation;
                let plannedHours;
                let availableHours; 
                if (isSummerVacation) {
                    plannedHours = 8;
                    availableHours = Math.max(0, 40 - state.hoursWorkedThisWeek);
                    // Cap at 40 max
                }
                else{
                plannedHours = isWeekend ? 8 : 4;
                availableHours = Math.max(0, 24 - state.hoursWorkedThisWeek);
                // Cap at 24 max
                }
                const actualHours = Math.min(plannedHours, availableHours); 
                state.hoursWorkedThisWeek += actualHours;

                // Warning Banner if shift was cut short
                let hoursWarning = '';
                if (actualHours < plannedHours) {
                    hoursWarning = `<div class="mt-2 text-center text-[10px] text-red-400 font-bold uppercase border border-red-500/50 bg-red-900/20 p-2 rounded">⚠️ Shift cut to ${actualHours}hrs (MA 24h Student Limit)</div>`;
                }

                // --- FINANCIAL LOGIC ---
                let baseWage = state.job?.wage || 0;
                
                // 1. Apply Promotion Multiplier
                const lvl = state.job.level || 1;
                let multiplier = 1.0;
                if (lvl === 2) multiplier = 1.25;
                if (lvl === 3) multiplier = 1.50;
                
                let wage = baseWage * multiplier;
                
                // 2. Skill Bonus
                if (state.skill === 'code' && state.job.type === 'tech') wage = wage * 1.5;

                // 3. Gross & Net (Using actualHours)
                const gross = wage * actualHours; 
                const taxRate = 0.2367;
                const tax = gross * taxRate;
                let net = gross - tax;
                let tipBonus = 0;

                if (state.skill === 'customer' && ['food', 'retail'].includes(state.job.type)) {
                    // Pro-rate tips based on actual hours worked
                    let baseTip = isWeekend ? 15.00 : 7.50;
                    tipBonus = baseTip * (actualHours / plannedHours);
                    net += tipBonus;
                }

                state.balance += net;
            state.endgameStats.totalMoneyEarned += net; 
                state.dayStats.cash += net;
                
                // Append Financial Breakdown
                logHtml += `
                    <div class="mt-2 bg-slate-950/50 p-3 rounded-xl border border-slate-700">
                        <div class="flex justify-between text-[10px] text-slate-400 font-bold uppercase tracking-wider">
                            <span>Gross Pay (${actualHours}hrs @ Lvl ${lvl})</span>
                            <span>$${gross.toFixed(2)}</span>
                        </div>
                        <div class="flex justify-between text-[10px] text-red-400 font-bold uppercase tracking-wider">
                            <span>Tax (23.67%)</span>
                            <span>-$${tax.toFixed(2)}</span>
                        </div>
                        ${tipBonus > 0 ? `<div class="flex justify-between text-[10px] text-acs-gold font-bold uppercase tracking-wider"><span>Skill: Tips</span><span>+$${tipBonus.toFixed(2)}</span></div>` : ''}
                        <div class="mt-2 pt-2 border-t border-slate-700 flex justify-between text-sm text-green-400 font-black uppercase tracking-widest">
                            <span>Net Pay</span>
                            <span>+$${net.toFixed(2)}</span>
                        </div>
                    </div>
                    ${hoursWarning}
                `;
                
                // --- APPLY STATS (Pro-rated for shortened shifts) ---
                let hoursRatio = actualHours / plannedHours;
                
                let stressGain = window.getStressImpact(25);
                if (state.traits.includes('patient')) stressGain = Math.round(stressGain * 0.75);
                stressGain = Math.ceil(stressGain * hoursRatio); // Scale stress down if shift was shorter
                
                state.stress = Math.min(100, state.stress + stressGain); 
                state.dayStats.stress += stressGain;
                
                let energyCost = 35;
                if (state.skill === 'multitask') energyCost = 25;
                if (!isWeekend) energyCost = Math.ceil(energyCost * 0.6);
                energyCost = Math.ceil(energyCost * hoursRatio); // Scale energy down if shift was shorter
                
                state.energy = Math.max(0, state.energy - energyCost); 
                state.dayStats.energy -= energyCost;

                state.hasWorkedToday = true; state.consecutiveDaysOffWork = 0;
                
                if (!state.roundmealActive) {
                    const minHunger = state.subscriptions.includes('hungrybox') ? 1 : 0;
                    state.hungerLevel = Math.max(minHunger, state.hungerLevel - 1);
                }
                
                // --- PROMOTION CHECK ---
                state.job.shiftsWorked = (state.job.shiftsWorked || 0) + 1;
                let promotion = null;

                if (lvl === 1 && state.job.shiftsWorked >= 7 && state.jobPerformance >= 80) {
                    promotion = 2;
                } else if (lvl === 2 && state.job.shiftsWorked >= 20 && state.jobPerformance >= 90) {
                    promotion = 3;
                }

                // Queue Modal
                window.queueModal("Shift Recap", logHtml, "Collect Wages", "💰", () => { 
                    // Check Promotion after closing recap
                    if (promotion) {
                        state.job.level = promotion;
                        const newTitle = window.getJobTitle(state.job.type, promotion);
                        const newWage = baseWage * (promotion === 2 ? 1.25 : 1.50);
                        
                        setTimeout(() => {
                            window.queueModal("PROMOTION!", `Excellent work. You have been promoted to <strong>${newTitle}</strong>.<br>Your base wage is now <strong>$${newWage.toFixed(2)}/hr</strong>.`, "Awesome", "📈", () => {
                                state.step = 'sim_dashboard'; 
                                window.updateUI(); 
                            });
                        }, 200);
                    } else {
                        state.step = 'sim_dashboard'; 
                        window.updateUI(); 
                    }
                });
            };

            if (s >= 80 && e <= 20) return { title: "Academic Zombie", desc: "Brain function limited. Sleep required immediately.", color: "text-purple-400" };

            if (s >= 80) return { title: "Panic Spiral", desc: "Cortisol overdose. Performance is suffering.", color: "text-red-400" };

            );

        }
        energyCost = 0;
    }
    else if (method === 'car') {
        const roll = Math.random();
        if (roll < 0.02) { window.triggerCarHospitalization(); return; }

                if (state.skill === 'multitask') {
                    energyCost = 5; // Overrides base
                }
                if (state.traits && state.traits.includes('organized')) {
                    energyCost = Math.max(0, energyCost - 5);
                }
                if (state.skill === 'fast') {
                    gradeBoost = 8;
                    flavor = "You breezed through the material thanks to your quick learning skills.";
                }
                if (state.negativeTrait === 'distracted') {
                    gradeBoost -= 2;
                    flavor = "It was really hard to focus, but you managed to get it done.";
                }
                
                // Item modifiers
                if (state.purchasedItems.includes('textbooks')) {
                    gradeBoost += 1;
                }

                // Friend modifiers
                if (window.hasActiveFriend('sawyer') && (state.sawyerHangouts || 0) >= 3) {
                    gradeBoost += 5;
                }
                if (window.hasActiveFriend('brad') && (state.bradHangouts || 0) >= 3) {
                    energyCost += 5; // Brad's "help" costs more energy
                    cashGain = 20;   // But he pays you
                }
                
                // --- 2. Check if player can afford it ---
                if (state.energy < energyCost) { 
                    window.queueModal("Exhausted", `You need ${energyCost} energy to focus on homework.`, "Okay", "💤"); 
                    return; 
                }

                // --- 3. Apply all effects to state ---
                state.hasDoneHomeworkToday = true;
                state.grades = Math.min(100, state.grades + gradeBoost); 
                state.dayStats.grades += gradeBoost;
                state.energy -= energyCost; 
                state.dayStats.energy -= energyCost;
                state.stress = Math.min(100, state.stress + stressGain); 
                state.dayStats.stress += stressGain;
                
                if (cashGain > 0) {
                    state.balance += cashGain;
                    state.dayStats.cash += cashGain;
                    state.endgameStats.totalMoneyEarned += cashGain;
                    state.log.unshift(`PERK: Brad paid you $${cashGain.toFixed(2)} for your 'help' with his homework.`);
                }

                // --- 4. Show result modal ---
                let cashHtml = cashGain > 0 ? `<div class="text-green-400 flex justify-between"><span>Brad's Payment</span><span>+$${cashGain.toFixed(2)}</span></div>` : "";

                    ${cashHtml}
                    <div class="text-blue-400 flex justify-between"><span>Academic Standing</span><span>+${gradeBoost}%</span></div>
                    <div class="text-red-400 flex justify-between"><span>Energy Cost</span><span>-${energyCost}%</span></div>
                    <div class="text-red-400 flex justify-between"><span>Mental Load</span><span>+${stressGain}% Stress</span></div>
                </div>`;

                window.queueModal("STUDY SESSION", flavor + html, "Finish", "📝", () => { window.updateUI(); }, null, false, "ACADEMICS");
                return;
            }

            // --- WORK LOGIC ---
            if (type === 'work') {
                if (state.hasWorkedToday) return;
                
                // Skip School Warning
                if (isSchoolDay && !state.hasAttendedSchoolToday) {
                    window.queueModal(
                        "Skip School?", 
                        "You haven't attended classes today. Working now means you will miss school (-15% GPA).", 
                        "Skip & Work", 
                        "⚠️", 
                        (confirmSkip) => {
                            if (confirmSkip) {
                                let minE = state.skill === 'multitask' ? 25 : 35;
                                if (state.energy < minE) { window.queueModal("Exhausted", "Too tired for work.", "Okay", "💤"); return; }
                                window.handleCommuteSelection('work');
                            }
                        }, 
                        "Go Back"
                    );
                    return;
                }

                let minE = state.skill === 'multitask' ? 25 : 35;
                if (state.energy < minE) { window.queueModal("Exhausted", "Too tired for work.", "Okay", "💤"); return; }
                window.handleCommuteSelection('work');

window.getClubRole = function(clubId, level) {
    const roles = {
        'soccer': ['Benchwarmer', 'Junior Varsity', 'Varsity'],
        'basketball': ['Benchwarmer', 'Junior Varsity', 'Varsity'],
        'band': ['Roadie', 'Backup Player', 'Main Lineup'],
        'theatre': ['Understudy', 'Supporting Role', 'Lead Role']
    };
    const defaultRoles = ['Member', 'Senior Member', 'President'];
    return (roles[clubId] || defaultRoles)[level - 1] || 'Member';
};

    if (state.hasTriedOutToday) {
         document.getElementById('modal-overlay').classList.add('hidden');
         window.queueModal("Limit Reached", "You can only try out for one club per day.", "Okay", "🛑", () => window.openClubsMenu());
          return;
    }
    if (state.energy < 20) {
         document.getElementById('modal-overlay').classList.add('hidden');
         window.queueModal("Too Tired", "Tryouts take 20 Energy. Rest up first!", "Okay", "💤", () => window.openClubsMenu());
          return;
    }

    // Route to Specific Game
    if (clubId === 'band') { window.startRhythmGame('tryout'); return; }
    if (clubId === 'theatre') { window.startTheatreGame('tryout'); return; }

    if (clubId === 'basketball') { window.startBasketballGame('tryout'); return; }

    // --- GENERIC "FOCUS TEST" (Stop the Bar) ---
    document.getElementById('modal-overlay').classList.add('hidden');
    const club = window.CLUBS_DB.find(c => c.id === clubId);

window.finishClubActivity = function(clubId, success, perfChange, msg, icon) {
    if (!state.clubProgress) state.clubProgress = {};
    if (!state.clubProgress[clubId]) state.clubProgress[clubId] = { level: 1, standing: 50, misses: 0, attended: 0 };
    
    const prog = state.clubProgress[clubId];
    const club = window.CLUBS_DB.find(c => c.id === clubId);
    
    // Apply changes
    prog.standing = Math.max(0, Math.min(100, prog.standing + perfChange));
    prog.misses = 0; // Reset consecutive misses
    prog.attended++;
    
    state.hasAttendedClubToday = true;
    state.energy = Math.max(0, state.energy - 20);
    state.dayStats.energy -= 20;

    // Apply standard club benefits
    if (success) {
        state.stress = Math.max(0, state.stress - 15);
        state.social = Math.min(100, state.social + 5);

        // --- UNLOCK MASON ---
        // Catch the unlock here during regular band practice, since 
        // specific minigame tryouts (like startRhythmGame) bypass the generic finishTryout!
        if (clubId === 'band' && typeof window.unlockContact === 'function') {
            window.unlockContact('mason');
        }
    } else {
        state.stress = Math.min(100, state.stress + 5); // Bad practice hurts
    }

    // Promotion Check
    let promotion = null;
    if (prog.level === 1 && prog.attended >= 5 && prog.standing >= 80) promotion = 2;
    if (prog.level === 2 && prog.attended >= 15 && prog.standing >= 95) promotion = 3;

    // Visual Output
    const color = success ? "text-green-400" : "text-red-400";
    const sign = perfChange > 0 ? '+' : '';
    
    let statsHtml = `
        <div class="mt-4 border-t border-slate-600 pt-4 font-bold text-sm">
            <div class="text-red-400 flex justify-between"><span>Energy</span><span>-20%</span></div>
            <div class="${color} flex justify-between"><span>Coach's Review</span><span>${sign}${perfChange}% Standing</span></div>
        </div>
    `;

    setTimeout(() => {
        window.queueModal(success ? "GOOD PRACTICE" : "ROUGH PRACTICE", msg + statsHtml, "Head Home", icon || "⚽", () => {
            if (promotion) {
                prog.level = promotion;
                const newRole = window.getClubRole(clubId, promotion);
                
                setTimeout(() => {
                     window.queueModal("PROMOTION!", `Your hard work paid off! You have been promoted to <strong>${newRole}</strong> in ${club.name}.`, "Awesome", "🏆", () => {
                         state.step = 'sim_dashboard'; 
                         window.updateUI(); 
                     });
                }, 200);
            } else {
                state.step = 'sim_dashboard'; 
                window.updateUI(); 
            }
        });
    }, 100);
};

        window.buyMeal = function(itemName, cost, energyGain, stressMod, targetLevel, isLunch = false, isDrink = false) {
            if (cost > 0 && state.balance < cost) { window.queueModal("Funds", "Insufficient balance.", "Okay", "💸"); return; }
            if (!isDrink && state.hungerLevel === 2) return; 
            
            let finalStress = window.getStressImpact(stressMod);
            // Fix: Check specific item name for stress waiver
            if (itemName === 'School Lunch' && state.hasUsedFreeBreakfastToday) { 
                finalStress = 0; 
            }

            state.balance -= cost; state.dayStats.cash -= cost;
            state.energy = Math.min(100, state.energy + energyGain); state.dayStats.energy += energyGain;
            state.stress = Math.max(0, Math.min(100, state.stress + finalStress)); state.dayStats.stress += finalStress;
            if (!isDrink) {
                // Logic change: Eating a meal just adds +1 level to current, max 2.
                // This allows going from 0 (Hungry) -> 1 (Fine), and then 1 -> 2 (Full) later.
                if (state.hungerLevel === 1) { 
                    state.hungerLevel = 2; 
                } else { 
                    state.hungerLevel = Math.max(state.hungerLevel, targetLevel);

        // Extracted Logic for reuse
        window.runEndDaySequence = function() {
            window.recordTutorialProgress(); // snapshot the Day 1 checklist before the daily flags reset
            const isSummerVacation = state.currentSeasonIndex === 3 && state.dayOfMonth >= 5;
            const isSchoolDay = state.dayIndex < 5 && !isSummerVacation;
            // 1. Existing Job/School Penalties
            if (state.isSchoolDay && !state.hasAttendedSchoolToday) {
                state.timesSkippedSchool = (state.timesSkippedSchool || 0) + 1;

                if (state.timesSkippedSchool === 3) {
                    window.unlockContact('kevin');
                }

                let truancyPenalty = 15;
                let penaltyMsg = "Skipped school. GPA dropped significantly.";
                
                // KEVIN BUFF: Reduced penalty for skipping
                if (window.hasActiveFriend('kevin') && (state.kevinHangouts || 0) >= 3) {
                    truancyPenalty = 5;
                    penaltyMsg = "Skipped school. Kevvy called the school and pretended to be your dad.";
                    state.log.unshift("PERK: Kevin's friendship reduced the GPA penalty for skipping.");
                }

                state.grades = Math.max(0, state.grades - truancyPenalty); 
                state.dayStats.grades -= truancyPenalty; 
                state.log.unshift(penaltyMsg);
            }
            // --- CLUB ATTENDANCE PENALTIES ---
            if (state.clubMemberships && state.clubMemberships.length > 0 && state.isSchoolDay) {
                state.clubMemberships.forEach(clubId => {
                    // Find the club data to check its schedule
                    const club = window.CLUBS_DB.find(c => c.id === clubId);
                    if (club && club.days.includes(state.dayIndex)) {
                        // The club met today! Did they go?
                        if (!state.hasAttendedClubToday) {
                            if (!state.clubProgress) state.clubProgress = {};
                            if (state.clubProgress[clubId]) {
                                state.clubProgress[clubId].misses = (state.clubProgress[clubId].misses || 0) + 1;
                                // Subtract 10 standing for skipping
                                state.clubProgress[clubId].standing = Math.max(0, state.clubProgress[clubId].standing - 10);
                                
                                // Log the truancy
                                state.log.unshift(`Missed ${club.name} practice. Coach is not happy (-10 Standing).`);
                            }
                        }
                    }
                });
            }
            // Days off count against you (weekends too), but only while you still could have worked this week.
            // Once the weekly hours cap is met, time between shifts isn't tracked until the next week.
            if (state.job && !state.hasWorkedToday && (state.hoursWorkedThisWeek || 0) < window.getWeeklyHourCap()) {
                state.consecutiveDaysOffWork++;
                if (state.consecutiveDaysOffWork > 1) state.jobPerformance = Math.max(0, state.jobPerformance - 15);
            }

            // --- BURNOUT LOGIC (Stress) ---
            if (state.burnoutWarningActive) {
                if (state.stress > 50) {
                    // Burnout Crash
                    state.burnoutCount++;
                    state.balance = Math.max(0, state.balance - 250); 
            state.endgameStats.totalMoneySpent += 250;
            state.dayStats.cash -= 250;
                    state.grades = Math.max(0, state.grades - 20); state.dayStats.grades -= 20;
                    state.stress = 20; state.energy = 30;
                    state.consecutiveHighStressDays = 0;
                    state.burnoutWarningActive = false;
                    window.queueModal("BURNOUT CRISIS", "You collapsed from mental exhaustion.<br><br><strong>-$250 Medical Bill, -0.8 GPA drop.</strong>", "Recover", "🏥", () => { window.finalizeDay(); }, null, false, "CRITICAL CONDITION");
                    return; 
                } else {
                    state.burnoutWarningActive = false;
                    state.consecutiveHighStressDays = 0;
                    window.queueModal("CRISIS AVERTED", "You lowered your stress levels. You feel stable.", "Phew", "😌", () => { window.checkAcademicStatus(); }, null, false, "HEALTH UPDATE");
                    return; 
                }
            }

            if (state.stress >= 85) {
                state.consecutiveHighStressDays = (state.consecutiveHighStressDays || 0) + 1;
            } else {
                state.consecutiveHighStressDays = 0;
            }

            if (state.consecutiveHighStressDays >= 2) {
                state.burnoutWarningActive = true;
                window.queueModal("BURNOUT WARNING", "Your stress has been critically high (85%+) for 2 days. <br><br><strong>Get Stress below 50% by tomorrow night or you will crash.</strong>", "I understand", "⚠️", () => { window.finalizeDay(); }, null, false, "HEALTH ALERT");
                return;
            }

            // Proceed to Academic Check if no Burnout issues
            window.checkAcademicStatus();
        };

        // NEW: Separate function to chain the logic cleanly
        window.checkAcademicStatus = function() {
            // 1.5 GPA = 37.5, 2.0 GPA = 50
            const lowGradeThreshold = 37.5; 
            const safeGradeThreshold = 50; 

            // 1. ACTIVE WARNING LOGIC
            if (state.academicWarningActive) {
                // A. Check Recovery (Did they fix it?)
                if (state.grades >= safeGradeThreshold) {
                    state.academicWarningActive = false;
                    state.consecutiveLowGradeDays = 0;
                    state.academicGracePeriod = 0;
                    window.queueModal("GRADES IMPROVED", "You managed to pull your GPA back up to a 2.0. The administration is off your back.", "Good", "🎓", () => { window.triggerDailyEvent(); }, null, false, "STATUS UPDATE");
                    return; 
                } 
                
                // B. Decrease Grace Period (Only on Weekdays: Mon=0 to Fri=4)
                if (state.dayIndex < 5) {
                    state.academicGracePeriod--;
                }

                // C. Check Failure (Timer ran out)
                if (state.academicGracePeriod <= 0) {
                    // Trigger Penalty
                    state.balance = Math.max(0, state.balance - 200);
            state.endgameStats.totalMoneySpent += 200; 
                    state.dayStats.cash -= 200;
                    state.grades = 37.5; // Reset to baseline
                    
                    let jobMsg = "";
                    if (state.job) {
                        jobMsg = `<br><span class="text-red-400">You had to quit your job at ${state.job.name} to focus on school.</span>`;
                        state.employmentHistory.push(`${state.job.name} (Forced Resignation)`);
                        state.job = null;
                        state.endgameStats.finalJob = null;
                    }

                    state.consecutiveLowGradeDays = 0;
                    state.academicWarningActive = false;

                    window.queueModal(
                        "ACADEMIC PROBATION", 
                        "Time is up. You failed to raise your grades. The school has mandated emergency tutoring.<br><br><strong>-$200.00 Tutoring Fee.</strong>" + jobMsg, 
                        "Study Hard", 
                        "📚", 
                        () => { window.finalizeDay(); }, 
                        null, false, "ACADEMIC ALERT"
                    );
                    return;
                }

                // D. Still in Grace Period - Proceed silently
                state.log.unshift(`Academic Warning Active: ${state.academicGracePeriod} school days remaining.`);
                window.triggerDailyEvent();
                return;
            }

            // 2. TRACKING LOGIC (No Warning Active)
            if (state.grades < lowGradeThreshold) {
                state.consecutiveLowGradeDays = (state.consecutiveLowGradeDays || 0) + 1;
            } else {
                state.consecutiveLowGradeDays = 0;
            }

            // 3. TRIGGER WARNING
            if (state.consecutiveLowGradeDays >= 2) {
                state.academicWarningActive = true;
                state.endgameStats.academicWarnings = (state.endgameStats.academicWarnings || 0) + 1;
                
                let gracePeriod = 3;
                if (window.hasActiveFriend('kingt') && (state.kingtHangouts || 0) >= 3) {
                    gracePeriod = 5;
                    state.log.unshift("PERK: King Triton's favor gives you more time to fix your grades.");
                }
                state.academicGracePeriod = gracePeriod; // Set window
                
                window.queueModal(
                    "FAILING GRADES", 
                    `Your GPA has been below 1.5 for 2 days. <br><br><strong>You have ${gracePeriod} school days to raise it to 2.0, or you will be forced into paid tutoring and lose your job.</strong>`, 
                    "I understand", 
                    "📉", 
                    () => { window.finalizeDay(); }, 
                    null, false, "ACADEMIC WARNING"
                );
                return;
            }

            // 4. Normal flow
            window.triggerDailyEvent();
        };

        window.triggerDailyEvent = function() {
            let eventId = "";

            // 1. Check Forced Event (Jeffrey Arc or others)
            if (state.forceDailyEventId) {
                eventId = state.forceDailyEventId;
                state.forceDailyEventId = null; // Clear it
            } else {
                // 2. Dynamic Random Picker (Excluding Jeffrey events which are forced only)
                // We filter the DB for IDs that do NOT start with 'jeff_'
                const allEvents = window.DAILY_EVENT_DB
                    .filter(e => !e.id.startsWith('jeff_'))
                    .map(e => e.id);
                
                eventId = window.getUnseenItem(allEvents, state.seenDailyEvents);
            }

            // Safety Check: If eventId is null/undefined (database exhausted?), just end day
            if (!eventId) {
                window.finalizeDay();
                return;
            }

            const dbEntry = window.DAILY_EVENT_DB.find(e => e.id === eventId);

            if (dbEntry) {
                // --- JEFFREY TRACKING WRAPPER ---
                if (typeof eventId === 'string' && eventId.startsWith('jeff_')) {
                    // Check if function exists before calling
                    if (typeof window.startJeffreyEvent === 'function') {
                        window.startJeffreyEvent(dbEntry);
                    } else {
                        console.error("startJeffreyEvent function missing!");
                        window.startStandardEvent(dbEntry); // Fallback
                    }
                } 
                else if (dbEntry.type === 'minigame') {
                    if (typeof window[dbEntry.func] === 'function') window[dbEntry.func]();
                    else window.finalizeDay();
                } 
                else {
                    window.startStandardEvent(dbEntry);
                }
            } else {
                console.error("Event ID not found in DB:", eventId);
                window.finalizeDay();
            }
        };
        
        // Specialized Wrapper for Jeffrey Events
        window.startJeffreyEvent = function(evt) {
            window.queueModal(
                evt.title, 
                evt.text, 
                evt.choices[0].label, // "Bad" Option
                evt.icon, 
                (choiceA) => {
                    let selected = choiceA ? evt.choices[0] : evt.choices[1];
                    
                    // SCORING
                    if (choiceA) state.jeffreyInfluenceScore++; // Bad Influence
                    else state.jeffreyInfluenceScore--; // Good Influence
                    
                    state.jeffreyEventsSeen++;

                    // Apply Stats (Safely)
                    if (selected.effects.cash) { state.balance += selected.effects.cash; state.dayStats.cash += selected.effects.cash; }
                    if (selected.effects.stress) { state.stress = Math.max(0, Math.min(100, state.stress + selected.effects.stress)); state.dayStats.stress += selected.effects.stress; }
                    if (selected.effects.energy) { state.energy = Math.max(0, Math.min(100, state.energy + selected.effects.energy)); state.dayStats.energy += selected.effects.energy; }
                    if (selected.effects.grades) { state.grades = Math.max(0, Math.min(100, state.grades + selected.effects.grades)); state.dayStats.grades += selected.effects.grades; }
                    if (selected.effects.hungerSet !== undefined) state.hungerLevel = selected.effects.hungerSet;

                    // Show Result
                    window.queueModal(
                        selected.resultTitle, 
                        selected.resultText, 
                        "Okay", 
                        evt.icon, 
                        () => {
                            // CHECK EVOLUTION (At 5 Events)
                            if (state.jeffreyEventsSeen >= 5 && !state.jeffreyArcComplete) {
                                window.evolveJeffrey();
                            } else {
                                window.finalizeDay();
                            }
                        }, 
                        null, false, "JEFFREY ARC"
                    );
                }, 
                evt.choices[1].label, // "Good" Option 
                false, 
                "JEFFREY ARC"
            );
        };
